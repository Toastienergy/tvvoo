name: Build image (GHCR)

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this upstream version already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: https://github.com/qwertyuiop8899/tvvoo.git
  IMAGE: ghcr.io/toastienergy/tvvoo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Patch source: the single top commit of the branch epg-multi-country
      - uses: actions/checkout@v4
        with:
          ref: epg-multi-country
          fetch-depth: 2
          path: patch

      # Current upstream state + our patch on top
      - name: Prepare source (upstream main + patch)
        id: src
        run: |
          git clone --quiet "$UPSTREAM" src
          cd src
          UP=$(git rev-parse --short=7 HEAD)
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch --quiet ../patch HEAD
          if git cherry-pick FETCH_HEAD; then
            echo "patch=applied" >> "$GITHUB_OUTPUT"
          elif [ -z "$(git status --porcelain --untracked-files=no)" ]; then
            # patch is already contained in upstream (e.g. PR merged)
            git cherry-pick --abort 2>/dev/null || git cherry-pick --skip || true
            echo "patch=already-upstream" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Patch no longer applies to upstream $UP - rebase epg-multi-country manually"
            git status --short
            exit 1
          fi
          echo "up=$UP" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this upstream version is already built
        id: exists
        run: |
          if docker buildx imagetools inspect "$IMAGE:up-${{ steps.src.outputs.up }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists != 'true' || inputs.force

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.exists != 'true' || inputs.force
        with:
          context: src
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.IMAGE }}:epg
            ${{ env.IMAGE }}:up-${{ steps.src.outputs.up }}
